name: CI

# Continuous integration for HPGS:
#   * Lint + smoke-test the Python codebase on Ubuntu and macOS-14.
#   * The manuscript PDF is built locally with `make paper`. This workflow
#     does not run latexmk. See docs/build.md.
#
# Trigger: every push and PR to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + smoke-test (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (runtime + dev)
        # Mirrors `make install` minus `pre-commit install` (the git hook is a
        # no-op in CI's ephemeral checkout).
        run: uv sync --extra dev

      - name: Lint (ruff check + ruff format --check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Smoke tests (pytest, no slow / no gpu)
        run: uv run pytest -q -m "not slow and not gpu"
