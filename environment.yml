name: hpgs
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - pyyaml
  - nibabel>=5.2
  - simpleitk>=2.3
  - scikit-image>=0.22
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - seaborn
  - plotly
  - jupyterlab
  - ipywidgets
  - tqdm
  - rich
  - pytest
  - ruff
  - mypy
  - pre-commit
  - pip:
      - torch>=2.3
      - monai>=1.4
      - fastmonai>=0.4
      - antspyx>=0.4.2
      - nnunetv2>=2.5
      - typer>=0.12
      - hydra-core>=1.3
      - omegaconf>=2.3
      - nbstripout
      - -e .
